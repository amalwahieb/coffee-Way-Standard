<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Coffee Way Standard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&display=swap');
body.ar{direction:rtl}
body.ar, body.ar *{font-family:'Noto Sans Arabic','JetBrains Mono',sans-serif !important}
body.ar .num, body.ar .abnum, body.ar .dateinp, body.ar input[inputmode="numeric"], body.ar input[inputmode="decimal"]{direction:ltr}
:root{--bg:#17120E;--panel:#1F1812;--line:#3A2F26;--paper:#F4EEE3;--paperLine:#E2D8C8;--ink:#2A2018;--inkSoft:#7A6A57;--cream:#EADFCF;--creamSoft:#A28F78;--copper:#D2792E;--copperBright:#E89A4B;--teal:#3E8E8E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--cream);padding:20px 16px 60px;-webkit-text-size-adjust:100%;overflow-x:hidden}
.wrap{max-width:680px;margin:0 auto}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.28em;color:var(--copper);text-transform:uppercase}
h1{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;letter-spacing:-.02em;margin:8px 0 18px;line-height:1.1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:20px 18px;margin-bottom:24px;overflow:hidden}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.flabel{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;color:var(--creamSoft);text-transform:uppercase;margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px}
.seg-btn{min-height:46px;padding:0 10px;border-radius:2px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12.5px;background:transparent;color:var(--cream);border:1px solid var(--line);font-weight:500;transition:all .12s}
.seg-btn.active{background:var(--copper);color:var(--bg);border-color:var(--copper);font-weight:700}
.seg.teal .seg-btn.active{background:var(--teal);border-color:var(--teal)}
.sel{width:100%;height:46px;padding:0 12px;border-radius:2px;background:var(--panel);color:var(--cream);border:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--creamSoft) 50%),linear-gradient(135deg,var(--creamSoft) 50%,transparent 50%);background-position:calc(100% - 16px) 20px,calc(100% - 11px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dateinp{width:100%;max-width:100%;min-width:0;height:46px;padding:0 12px;border-radius:2px;background:var(--panel);color:var(--cream);border:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;-webkit-appearance:none;appearance:none;text-align:center;box-sizing:border-box;overflow:hidden}
.dateinp::-webkit-date-and-time-value{margin:0;padding:0;text-align:center}
.dateinp::-webkit-calendar-picker-indicator{margin:0;padding:0}
.txt{width:100%;height:46px;padding:0 12px;border-radius:2px;background:var(--panel);color:var(--cream);border:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none}
.txt::placeholder{color:var(--creamSoft)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.preset{display:inline-flex;align-items:stretch;border:1px solid var(--teal);border-radius:2px;overflow:hidden}
.preset-load{background:transparent;color:var(--cream);border:none;font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px 10px;cursor:pointer;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset-del{background:transparent;color:var(--creamSoft);border:none;border-left:1px solid var(--line);padding:0 9px;cursor:pointer;font-size:12px}
.nopreset{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--creamSoft);margin-bottom:10px}
.saverow{display:flex;gap:6px}
.pname{flex:1;min-width:0;height:42px;padding:0 12px;border-radius:2px;background:var(--panel);color:var(--cream);border:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:12.5px;outline:none}
.pname::placeholder{color:var(--creamSoft)}
.savebtn{flex:none;height:42px;padding:0 14px;border-radius:2px;background:var(--teal);color:var(--bg);border:none;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer}
.step{display:flex;align-items:center;gap:8px}
.step-btn{width:46px;height:46px;flex:none;border-radius:2px;cursor:pointer;background:transparent;color:var(--cream);border:1px solid var(--line);font-size:22px;font-family:'JetBrains Mono',monospace;line-height:1}
.step-btn.small{width:40px;font-size:12px;color:var(--copperBright)}
.numbox{flex:1;height:46px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:2px}
.num{width:100%;height:100%;border:none;outline:none;background:transparent;text-align:center;font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--copperBright);font-weight:700}
.suf{font-family:'JetBrains Mono',monospace;color:var(--creamSoft);font-size:12px;padding-right:10px}
.hint{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--creamSoft)}
.fresh-dot{font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:8px}
/* card */
.card{background:var(--paper);color:var(--ink);border-radius:3px;padding:22px 20px}
.chead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ctitle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;line-height:1.1}
.cmethod{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--copper)}
.icedstrip{background:rgba(62,142,142,.12);border:1px solid var(--teal);border-radius:3px;padding:11px 14px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink);font-weight:700;text-align:center}
.grind{background:var(--bg);color:var(--cream);border-radius:3px;padding:14px 16px;margin-bottom:16px}
.glabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--copperBright);text-transform:uppercase;margin-bottom:6px}
.gnum{font-family:'JetBrains Mono',monospace;font-size:25px;font-weight:700}
.gwf{font-size:12px;color:var(--creamSoft);margin-top:6px;line-height:1.45}
.gsize{display:flex;align-items:center;gap:9px;margin-top:10px}
.swatch{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.05);padding:6px 8px;border-radius:3px;min-height:24px}
.swatch i{display:block;background:var(--cream);border-radius:50%;flex:none}
.gsizetxt{font-size:12.5px;color:var(--cream)}
.gtip{font-size:11px;color:var(--creamSoft);margin-top:8px;font-style:italic;line-height:1.4}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:12px;padding-bottom:16px;border-bottom:1px solid var(--paperLine);margin-bottom:16px}
.rk{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--inkSoft);text-transform:uppercase;margin-bottom:4px}
.rv{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;line-height:1.05;white-space:nowrap}
.ru{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--inkSoft);margin-top:3px;white-space:nowrap}
.fresh{font-size:13.5px;line-height:1.5;color:var(--inkSoft);margin-bottom:18px}
.sect{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:var(--inkSoft);text-transform:uppercase;margin-bottom:12px}
.row{display:flex;gap:12px}.row+.row{margin-top:16px}
.time{width:42px;flex:none;text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700}
.ncol{position:relative;width:14px;flex:none}.dot{width:11px;height:11px;border-radius:50%;background:var(--copper);margin-top:3px}
.vline{position:absolute;left:5px;top:14px;bottom:-16px;width:1px;background:var(--paperLine)}
.content{flex:1;min-width:0}
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plabel{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px}
.amt{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--teal);font-weight:700;white-space:nowrap}.cum{color:var(--inkSoft);font-weight:400}
.barwrap{height:6px;background:var(--paperLine);border-radius:3px;margin:6px 0;overflow:hidden}.bar{height:100%;background:var(--teal);border-radius:3px;transition:width .25s}
.pnote{font-size:12.5px;color:var(--inkSoft);line-height:1.45}
.notes{margin-top:20px;padding-top:16px;border-top:1px solid var(--paperLine);display:grid;gap:14px}
.note{display:flex;gap:12px}.nlabel{flex:none;width:90px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--copper);text-transform:uppercase;padding-top:2px;line-height:1.3}.ntext{font-size:13px;line-height:1.5;color:var(--ink)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.navbtn{background:transparent;color:var(--copper);border:1px solid var(--line);border-radius:2px;padding:9px 13px;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;font-weight:700}
.navwrap{display:flex;gap:6px}
.libsub{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--creamSoft);margin:-8px 0 16px;line-height:1.5}
.learn-sec{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px 16px;margin-bottom:14px}
.learn-h{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--copperBright);margin-bottom:12px}
.learn-item{margin-bottom:12px}
.learn-item:last-child{margin-bottom:0}
.learn-t{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--cream);font-weight:700;margin-bottom:3px}
.learn-d{font-size:13px;color:var(--creamSoft);line-height:1.55}
#saveBar{margin-top:18px}
.savebar-btn{width:100%;min-height:48px;border-radius:2px;border:1px solid var(--teal);background:transparent;color:var(--teal);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer}
.saveform{display:none;gap:6px;margin-top:8px}
.saveform.open{display:flex}
.cancelbtn{flex:none;width:48px;height:46px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--creamSoft);font-size:14px;cursor:pointer}
.coach{margin-top:20px;padding-top:16px;border-top:1px solid var(--paperLine)}
.coach-q{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--inkSoft);text-transform:uppercase;margin-bottom:11px;line-height:1.4}
.tastes{display:flex;flex-wrap:wrap;gap:6px}
.taste{border:1px solid var(--paperLine);background:#fff;color:var(--ink);border-radius:2px;padding:9px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer}
.taste.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.taste.great{border-color:var(--teal);color:var(--teal)}
.chint{margin-top:12px;background:rgba(42,32,24,.05);border-inline-start:2px solid var(--copper);padding:12px 14px;border-radius:2px}
.chint-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--ink);margin-bottom:7px}
.chint-move{font-size:13px;color:var(--ink);line-height:1.5;margin-bottom:5px}
.chint-why{font-size:12.5px;color:var(--inkSoft);line-height:1.5;margin-bottom:9px;padding-bottom:9px;border-bottom:1px dashed var(--paperLine)}
.applybtn{width:100%;min-height:46px;margin-top:12px;border-radius:2px;border:none;background:var(--copper);color:var(--bg);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer}
.chint-note{font-size:12px;color:var(--inkSoft);line-height:1.5;margin-top:11px;font-style:italic}
.hist-act{color:var(--copper);font-weight:700}
.why{margin-bottom:16px}
.why-toggle{width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:2px;padding:11px 13px;color:var(--copperBright);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer}
.why-body{margin-top:8px;padding:0 2px}
.why-line{font-size:13.5px;color:var(--ink);line-height:1.55;margin-bottom:10px}
.why-line:last-child{margin-bottom:0}
.why-origin{color:var(--inkSoft);padding-top:10px;border-top:1px solid var(--paperLine)}
.chint-age{font-size:12px;color:var(--inkSoft);line-height:1.45;margin-top:7px;font-style:italic}
.libtitle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:6px 0 16px;color:var(--cream)}
.libempty{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--creamSoft);line-height:1.6;padding:18px 0}
.lib-entry{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 16px;margin-bottom:10px}
.lib-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lib-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--cream)}
.lib-sum{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--creamSoft);margin-top:4px;line-height:1.4}
.lib-badge{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--teal);border:1px solid var(--teal);border-radius:2px;padding:3px 6px;white-space:nowrap;flex:none}
.lib-actions{display:flex;gap:6px;margin-top:12px}
.lib-load{flex:1;height:40px;border-radius:2px;border:none;background:var(--copper);color:var(--bg);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer}
.lib-del{flex:none;width:46px;height:40px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--creamSoft);cursor:pointer}
.afterbrew{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px 16px}
.ab-title{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--creamSoft);text-transform:uppercase;margin:26px 0 12px}
.ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ab-l{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--creamSoft);margin-bottom:6px}
.abnum{width:100%;height:44px;padding:0 12px;border-radius:2px;background:var(--bg);color:var(--copperBright);border:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;outline:none;text-align:center}
.abnum::placeholder{color:var(--creamSoft);font-weight:400;font-size:13px}
.ab-result{margin-top:12px}
.ab-exp{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--cream);line-height:1.5}
.ab-you{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--copperBright);font-weight:700;margin-top:8px}
.ab-verdict{font-size:12.5px;line-height:1.45;margin-top:5px;color:var(--creamSoft)}
.ab-verdict.fast{color:var(--copperBright)}.ab-verdict.stall{color:#E0885A}.ab-verdict.ok{color:var(--tealSoft)}
.active-hint{display:none;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--creamSoft);margin-bottom:8px;line-height:1.5}
.linkbtn{background:transparent;border:none;color:var(--copper);font-family:'JetBrains Mono',monospace;font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0}
.lib-entry.active{border-color:var(--copper)}
.hist-wrap{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:5px}
.hist{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--cream);line-height:1.6}
.hist-date{color:var(--creamSoft);opacity:.7;margin-right:2px}
.hist-grind{color:var(--copperBright);font-weight:700}
.hist-chg{color:var(--tealSoft)}
.starttimer{width:100%;min-height:46px;margin-bottom:16px;border-radius:2px;border:none;background:var(--copper);color:var(--bg);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer}
.tov{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;padding:28px 20px 40px}
.tov.show{display:block}
.tov-inner{max-width:520px;margin:0 auto;text-align:center}
.tov-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.28em;color:var(--copper);text-transform:uppercase;margin-bottom:18px}
.tov-time{font-family:'JetBrains Mono',monospace;font-size:76px;font-weight:700;color:var(--cream);line-height:1;letter-spacing:-.02em}
.tov-target{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:var(--copperBright);margin-top:18px;min-height:32px}
.tov-note{font-size:14px;color:var(--creamSoft);margin-top:8px;line-height:1.5;min-height:20px}
.tov-bar{height:8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:22px 0 10px}
#tBar{height:100%;width:0;background:var(--teal);transition:width .2s}
.tov-next{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--teal);min-height:20px;margin-bottom:22px}
.tov-steps{display:grid;gap:6px;margin-bottom:24px;text-align:start}body.ar .tov-steps{text-align:right}
.tstep{display:flex;gap:12px;align-items:baseline;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--creamSoft);padding:8px 12px;border:1px solid var(--line);border-radius:2px;opacity:.5}
.tstep.active{opacity:1;border-color:var(--copper);color:var(--cream);background:rgba(210,121,46,.1)}
.tstep.done{opacity:.4}
.tstep-t{width:44px;flex:none;font-weight:700}
.tstep-l{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:700}
.tstep-c{color:var(--teal)}
.tov-ctrls{display:flex;gap:8px}
.tov-btn{flex:1;min-height:50px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer}

"The basics that matter.":"الأساسيات المهمة.","Manual":"يدوية","Electric":"كهربائية","Grind":"الطحن","Why brew time matters":"لماذا وقت التحضير مهم","What it is":"وش يعني؟","The total time from the first drop of water to an empty, drained bed. You never control it directly — it is the result of your grind, your dose, and how you pour.":"الوقت الكامل من أول قطرة ماء حتى جفاف الطبقة وتصريفها. أنت لا تتحكم به مباشرة — إنه نتيجة الطحنة والكمية وطريقة الصبّ.","Why it matters":"لماذا يهم","Water needs enough contact time to dissolve the sweetness out of the coffee. Brew time is the clearest sign of whether that contact actually happened.":"الماء يحتاج وقت تلامس كافيًا ليُذيب الحلاوة من القهوة. وقت التحضير هو أوضح دليل على أن هذا التلامس حدث فعلًا.","Way too fast":"أسرع بكثير من اللازم","Water raced through without extracting enough — expect a weak, sour, thin cup. Usual causes: grind too coarse, or channeling from uneven pouring.":"نزل الماء بسرعة دون استخلاص كافٍ — غالبًا بيطلع الفنجان خفيف، حامض، وناقص استخلاص. الأسباب المعتادة: طحن أخشن من اللازم، أو قنوات بسبب صبّ غير متساوٍ.","Way too slow":"أبطأ بكثير من اللازم","Water sat on the coffee too long and kept stripping harsh compounds — expect bitter, dry, muddy. Usual causes: grind too fine, too much agitation, or a clogged filter.":"جلس الماء فوق القهوة فترة أطول من اللازم، وكمل يسحب نكهات مرة وخشنة — توقّع مرارة وجفافًا وعكارة. الأسباب المعتادة: طحن أنعم من اللازم، أو تحريك زائد، أو انسداد الفلتر.","Fix the cause, not the clock":"عالج السبب لا الساعة","You do not fix time directly — adjust the grind and time follows. Finishing near the expected time with an even bed is the real target.":"لا تحاول تعدل الوقت نفسه — عدّل الطحنة والوقت بيتعدل معها. الهدف الحقيقي هو الانتهاء قرب الوقت المتوقع مع طبقة متساوية.","Taste is the judge":"الطعم هو الحكم","A rough guide: within about 30 seconds of the recipe finish time is normal. If the time looked off but the cup tastes great — trust the cup. Time is a guide, taste decides.":"قاعدة تقريبية: أي نتيجة ضمن نحو 30 ثانية من وقت النهاية في الوصفة طبيعية. وإن بدا الوقت خاطئًا والطعم رائعًا — اعتمد على الطعم. الوقت دليل، والطعم هو الأساس.","Pour timer":"مؤقّت الصبّ","Machine":"الآلة","Wet-hulled (Sumatra)":"التقشير الرطب (سومطرة)","earthy, herbal, heavy body, low acidity":"ترابية، عشبية، قوام ثقيل، حموضة منخفضة","Body over brightness — standard pours; expect a slow, muddy-looking bed.":"القوام قبل الإشراق — صبات عادية؛ وتوقّع سريرًا بطيئًا داكن المظهر.","Decaf (any method)":"منزوعة الكافيين (أي طريقة)","softer, rounder version of the bean":"نسخة أنعم وأدفأ من الحبة","Porous beans extract fast — brewed cooler; go coarser before anything else if bitter.":"الحبوب المسامية تُستخلص بسرعة — تُحضَّر أبرد؛ وإن ظهرت مرارة فاجعل الخشونة أول علاج.","Wet-hulled (Giling Basah)":"التقشير الرطب (جيلينغ باساه)","Sumatra’s method: the parchment is stripped while the bean is still wet and soft, then dried bare. It trades acidity for weight — earthy, herbal, syrupy cups. If the bag says Sumatra and tastes like a forest floor in the best way, this is why.":"طريقة سومطرة: يُنزع الغلاف والحبة ما زالت رطبة وطرية، ثم تُجفف عارية. تستبدل الحموضة بالوزن — أكواب ترابية عشبية كثيفة. إن قال الكيس سومطرة وذاقت كأرض غابة بأجمل معنى، فهذا هو السبب.","Decaf":"منزوعة الكافيين","Caffeine is removed before roasting (Swiss Water, CO2, or EA methods). The processing leaves beans porous and fast-extracting, so decaf turns bitter easily — the app brews it a degree cooler, and coarser is the first fix if it still bites.":"يُنزع الكافيين قبل التحميص (بطرق المياه السويسرية أو ثاني أكسيد الكربون أو EA). تترك المعالجة الحبوب مسامية سريعة الاستخلاص، فتميل منزوعة الكافيين إلى المرارة بسهولة — يُحضّرها التطبيق أبرد بدرجة، والخشونة أول علاج إن بقيت المرارة.","Thailand":"تايلاند","mild, sweet, chocolate-nut, gentle fruit":"لطيفة، حلوة، شوكولاتة ومكسرات، فواكه هادئة","Co-fermented / Infused":"تخمير مشترك / منكّهة","loud added aromatics riding over the base coffee":"عطريات مضافة صاخبة فوق القهوة الأساس","Keep it cool and gentle — added aromatics turn harsh fast.":"أبقها باردة ولطيفة — العطريات المضافة تتحول لقسوة بسرعة.","Co-fermented: fruit, spices, or specific yeasts are added to the fermentation tank so the flavor develops inside the seed. Infused: flavor is added after processing. Both give loud, unmistakable aromatics — and honest roasters disclose which one you are holding. Brewed slightly cooler so the added notes stay pleasant instead of harsh.":"التخمير المشترك: تُضاف فواكه أو توابل أو خمائر محددة إلى خزان التخمير فتتكوّن النكهة داخل الحبة. المنكّهة: تُضاف النكهة بعد المعالجة. كلاهما يعطي عطريات صاخبة لا تُخطئها الأذن — والمحامص الصادقة تفصح أيهما بين يديك. تُحضَّر أبرد قليلًا لتبقى النكهات المضافة لطيفة بدل أن تقسو.","Origin, roast, and the date — one chain":"المنشأ والتحميص والتاريخ — سلسلة واحدة","Origin sets the bean":"المنشأ يحدد الحبة","Altitude and variety decide density and character. Roasters pick the roast level to flatter it: bright, dense coffees (Ethiopia, Kenya) usually go lighter to protect florals; softer, nutty ones (Brazil) take medium-dark gracefully. That is why you rarely meet a dark Gesha.":"الارتفاع والسلالة يحددان كثافة الحبة وطابعها. والمحمصون يختارون درجة التحميص لتُبرز هذا الطابع: القهوة الكثيفة المشرقة (إثيوبيا وكينيا) غالبًا تُحمّص فاتحة لحماية الزهور، واللينة المكسراتية (البرازيل) تتقبل التحميص الأغمق بأناقة. لهذا نادرًا ما تقابل جيشا غامقة.","Roast sets the clock":"التحميص يضبط الساعة","Darker roasts are more porous and release their CO2 faster — they peak earlier and fade sooner. Light roasts trap gas in dense structure: they need longer rest and stay good longer. Process nudges the same clock — naturals usually want a few extra days.":"التحميص الغامق أكثر مسامية فيُطلق غازاته أسرع — يبلغ ذروته مبكرًا ويذبل مبكرًا. والفاتح يحبس الغاز في بنية كثيفة: يحتاج راحة أطول ويعيش أطول. والمعالجة تحرّك الساعة نفسها — الطبيعية غالبًا تريد أيامًا إضافية.","The date tells you where you are":"التاريخ يخبرك أين أنت","Day 20 can mean at its peak for a light washed coffee and past it for a dark roast. The number on the bag only means something combined with the roast and process.":"اليوم العشرون قد يعني «في القمة» لقهوة فاتحة مغسولة و«تعدّى ذروته» لتحميصة غامقة. الرقم على الكيس لا معنى له إلا مع التحميص والمعالجة.","What the app does with this":"ماذا يفعل التطبيق بهذا","Your rest window is computed from roast and process, the freshness stage nudges grind and temperature, and the widget counts the days for you. Enter the roast date once — the chain runs itself.":"نافذة الراحة تُحسب من التحميص والمعالجة، ومرحلة النضارة تعدّل الطحنة والحرارة، والودجت يعدّ الأيام عنك. أدخل تاريخ التحميص مرة واحدة — والسلسلة تعمل وحدها.","Same temp":"حرارة ثابتة","Hot → cooler":"حار ← أبرد","Cool → hotter":"بارد ← أسخن","None":"بدون","Fellow Aiden":"فيلو أيدن","xBloom":"إكس بلوم","Paste an import code (CWS1...)":"الصق رمز استيراد (...CWS1)","Import brew":"استورد الوصفة","Skip":"تخطّي","Pause":"إيقاف مؤقت","Resume":"استئناف","Reset":"إعادة","Close":"إغلاق","Swirl":"التدوير (Swirl)","Hold the brewer or server and give it a gentle circular shake — like swirling juice in a glass — to level the bed and even out extraction. No spoon: stirring is a different, stronger move.":"أمسك القمع أو الوعاء ودوّره بحركة دائرية خفيفة — بحركة دائرية خفيفة حتى تستوي طبقة القهوة — عشان تستوي طبقة القهوة ويتساوى الاستخلاص. بدون ملعقة: التقليب بالملعقة حركة ثانية أقوى.","How each process is made":"أنواع المعالجة وكيف تُصنع","Natural (dry)":"طبيعية (مجففة)","The fruit is stripped off the seed, the beans ferment in water tanks to loosen the last sticky layer, then they are washed clean and dried. You taste the bean itself: clean, clear, brighter acidity.":"يُشال قشر الثمرة عن البذرة، وتنقع الحبوب في الماء حتى تنفصل الطبقة اللزجة، وبعدها تنغسل وتتجفف، وبعدها تُغسل وتُجفف. تذوق فيها الحبة نفسها: نظيفة وواضحة وحموضتها أعلى.","The skin comes off but some of the sticky fruit layer (the honey) stays on the bean while it dries. Halfway between washed and natural: more sweetness and body than washed, cleaner than natural.":"تُشال القشرة لكن يظل جزء من الطبقة اللزجة (العسل) على الحبة وهي تجف. نص الطريق بين المغسولة والطبيعية: حلاوة وقوام أكثر من المغسولة، وأنظف من الطبيعية.","The whole cherry is dried in the sun with the fruit still on, then hulled. The bean absorbs fruit sugars for days — fruity, heavy, wine-like sweetness, and a more fragile bed when you brew.":"تُجفف الثمرة كاملة تحت الشمس والفاكهة عليها، وبعدها تُقشر. الحبوب تمتص جزءًا من سكريات الفاكهة وهي تجف — فاكهية وثقيلة وحلاوتها تشبه النبيذ، وطبقتها أهش وقت التحضير.","Cherries ferment in sealed, oxygen-free tanks before drying. The controlled fermentation creates bold, unusual flavours — funky, boozy, intense. A little goes a long way; brew it gently.":"تتخمّر الثمار في خزانات مقفلة بدون أكسجين قبل التجفيف. التخمير المتحكم فيه يعطي نكهات جريئة وغير مألوفة — قوية ومركّزة. نكهاتها قوية، لذلك غالبًا تحتاج تحضير هادئ واستخلاص متوازن.","Clicks from zero — espresso lands around 13–15, pour-over roughly double that.":"نقرات من الصفر — الإسبريسو نحو 13–15، والتقطير قرابة الضعف.","Café workhorse — filter sits around 7–10 on the 1–16 dial; every machine drifts, anchor to taste.":"مطحنة المقاهي — الترشيح بين 7 و10 على قرص 1–16؛ كل آلة تختلف قليلًا فاعتمد على التذوّق.","12-position ring with wide steps — expect a real jump between numbers.":"قرص 12 وضعية بخطوات واسعة — توقّع فرقًا واضحًا بين رقم وآخر.","16 positions across four zones — pour-over lives in the middle zones.":"16 وضعية على أربع مناطق — التقطير في المناطق الوسطى.","18-position dial with wide steps — dial by taste.":"قرص 18 وضعية بخطوات واسعة — اضبط بالتذوّق.","rotations":"دورة","Internal dial under the burr, 30 clicks per rotation — count from zero.":"قرص داخلي تحت الشفرات، 30 نقرة لكل دورة — عُدّ من الصفر.","External dial J-series — J-Max 90 clicks/turn, J-Ultra 100; numbers land close, adjust by taste.":"قرص خارجي لسلسلة J — جي-ماكس 90 نقرة/دورة وجي-ألترا 100؛ الأرقام متقاربة، عدّل بالتذوّق.","External dial, 12.5µm/click, 60 clicks per turn.":"قرص خارجي، 12.5 ميكرون/نقرة، 60 نقرة لكل دورة.","Red Clix axle: each stock click becomes two — numbers run about double a standard C40.":"محور ريد كليكس: كل نقرة أصلية تصبح نقرتين — الأرقام تقارب ضعف C40 القياسي.","Gen 1 cuts a touch coarser than Gen 2 at the same number.":"الجيل الأول يطحن أخشن قليلًا من الجيل الثاني عند الرقم نفسه.","Stepless numbered dial — espresso sits around 2–3, filter mid-dial.":"قرص مرقّم بلا درجات — الإسبريسو نحو 2–3، والفلتر في منتصف القرص.","80 levels, 18.75µm each — set in the app or on the dial.":"80 مستوى، 18.75 ميكرون لكل مستوى — يُضبط من التطبيق أو القرص.","Numbers 1–15 with clicks between — pour-over sits mid-scale.":"أرقام 1–15 مع نقرات بينها — التقطير في منتصف المقياس.","Espresso-first grinder — pour-over lives at the very top of the macro ring.":"مطحنة إسبريسو أولًا — التقطير عند أعلى حلقة الضبط الكبرى.","around the filter mark on the gauge":"قرب علامة الفلتر على المؤشر","just coarser than your espresso point":"أخشن قليلًا من نقطة الإسبريسو لديك","the filter end of the worm dial":"طرف الفلتر من القرص الدودي","around your filter reference":"قرب رقمك المرجعي للفلتر","around the filter zone of the dial":"قرب منطقة الفلتر على القرص","g":"غ","Fruity · Kasuya 4:6":"فاكهي · كاسويا 4:6","Balanced · Hoffmann":"متوازن · هوفمان","Sweeter · Kasuya 4:6":"حلاوة · كاسويا 4:6","Osamah Alawwam":"أسامة العوّام","Osamah Alawwam · Roasting House owner":"أسامة العوّام · مالك بيت التحميص","Osamah Alawwam method — a generous, slow first pour to about 63%, then two short finishing pulses. Runs cooler with a slightly richer ratio for a sweet, full cup. Recipe by Osamah Alawwam (Roasting House owner).":"طريقة أسامة العوّام — صبة أولى كبيرة وبطيئة إلى قرابة 63%، وبعدها صبتان قصيرتان وانتهينا. حرارة أبرد شوي ونسبة أغنى، والنتيجة فنجان حلو وممتلئ. الوصفة لأسامة العوّام (مالك بيت التحميص).","Slow, steady spiral — take your time, about 25 seconds.":"حركة لولبية بطيئة وثابتة — خذ وقتك، نحو 25 ثانية.","Short, gentle pulse.":"نبضة قصيرة لطيفة.","Top up to full, then a gentle final swirl.":"كمل باقي الصبة، ثم تدويرة أخيرة لطيفة.","Pour":"صبة","One steady pour straight to full — simple and even. Give it a gentle swirl to settle.":"صبة واحدة ثابتة للآخر — بسيطة ومتساوية. دوّرها تدويرة خفيفة عشان تستقر.","Hoffmann iced":"هوفمان بارد","Kasuya 4:6 iced":"كاسويا 4:6 بارد","50/50 flash":"بارد 50/50","balanced":"متوازن","fruity":"فاكهي","sweet":"حلاوة","immersion":"غمر","Steep":"نقع","Press":"ضغط","Release":"تحرير","Saturate every ground, then swirl gently.":"رطّب كل القهوة المطحونة ثم دوّر الوعاء بلطف.","Steady spirals up to 60%. Let it settle a moment before the next pour.":"حركة لولبية ثابتة حتى 60%. اتركها تستقر لحظة قبل الصبة التالية.","Bigger first pour leans fruity. Swirl.":"صبة أولى أكبر تميل للفاكهية. دوّر الوعاء.","Smaller first pour leans sweeter. Swirl.":"صبة أولى أصغر تميل للحلاوة. دوّر الوعاء.","A smaller second pour completes the 40% — the big first pour tips it toward acidity.":"صبة ثانية أصغر تُكمل الـ40% — الصبة الأولى الكبيرة ترجّح الحموضة.","A bigger second pour completes the 40% — the small first pour tips it toward sweetness.":"صبة ثانية أكبر تُكمل الـ40% — الصبة الأولى الصغيرة ترجّح الحلاوة.","Final pour to full volume.":"الصبة الأخيرة — باقي كمية الماء.","Strength-building pour.":"صبة لبناء القوة.","Add water, stir 3×":"أضف الماء، حرّك 3 مرات","Steep ~60s":"انقع ~60 ثانية","Press slowly over ~30s":"اضغط ببطء خلال ~30 ثانية","Valve closed; bloom and swirl":"الصمام مقفول؛ رطّب ودوّر الوعاء","Steep until ~1:45":"انقع حتى ~1:45","Open the valve to drain":"افتح الصمام للتصريف","e.g. peach, jasmine, honey":"مثل: خوخ، ياسمين، عسل","clicks":"نقرة","turns":"دورة"," (by feel)":" (بالتقدير)","No saved bags yet.<br>Dial one in, then tap “Tasted great ✓” or “Save this bag”.":"لا توجد أكياس محفوظة بعد.<br>اضبط واحدًا، ثم اضغط “طعمها رائع ✓” أو “احفظ هذه الوصفة”.","Light roasts cling to flavour — swirl after the bloom and after each pour, and pour from a little higher.":"التحميص الفاتح يمسك نكهته — دوّر الوعاء بعد الترطيب وبعد كل صبة، واسكب من شوي أعلى.","Swirl gently after the bloom and once at the end. Keep pours calm and central.":"دوّر الوعاء بلطف بعد الترطيب ومرة في الآخر، وخل الصب هادئًا وفي النص.","Go gentle: low, soft pours and a single light swirl. This roast turns bitter if stirred hard.":"على راحتك: صبات واطية وناعمة وتدويرة وحدة خفيفة. هذا التحميص يصير مرًّا بسرعة لو حرّكته بقوة.","Washed: Brew straight for clarity.":"مغسولة: حضّرها على طول، بتعطيك وضوحًا.","Honey: Standard pours; sweetness sits in the middle.":"عسلية: صبات عادية؛ الحلاوة في النص.","Natural: Gentler pours — the bed is fragile and degasses fast.":"طبيعية (مجففة): خفّف صباتك — الطبقة هشة وتطلع غازًا بسرعة.","Anaerobic: Pull it back: cooler or coarser so the funk doesn't dominate.":"لا هوائية: هدّيها: أبرد أو أخشن عشان ما تطغى نكهة التخمير.","Aromatics are delicate — don't over-agitate; let the floral top notes survive.":"عطرياتها ناعمة — لا تكثر التحريك، خل النكهات الزهرية تعيش.","Can take a slightly finer grind to pull more of that blackcurrant depth.":"تتحمل طحنة أنعم شوي عشان يبان عمق الكشمش الأسود.","Forgiving and balanced — a great bag to benchmark your dial-in on.":"متسامحة ومتوازنة — كيس ممتاز تضبط عليه معايرتك.","Soft and forgiving — a clean, balanced everyday cup; often organic and washed.":"ناعمة ومتسامحة — فنجان يومي نظيف ومتوازن، وغالبًا عضوية ومغسولة.","Dense, low-acid flavour; keep temp moderate or it turns ashy.":"نكهتها كثيفة وحموضتها قليلة؛ خل الحرارة وسط وإلا طلعت رمادية.","Treat it gently: low agitation, clean even pours. Don't bully a Gesha.":"عاملها بلطف: تحريك قليل وصبات نظيفة متساوية. الجيشا ما ينفع تقسى عليها.","Jazan Khawlani is usually natural-processed and heritage-grown — treat like a rich natural: gentle pours, and don't over-extract the spice.":"البن الخولاني (جازان وعسير والباحة) غالبًا معالجته طبيعية وزراعته تراثية على 800–2500م — عامله كطبيعية غنية: صبات لطيفة، ولا تسحب توابله زيادة.","Usually roasted darker — lean coarser and cooler with gentle pours.":"غالبًا محمّص أغمق — روح أخشن وأبرد مع صبات لطيفة.","jasmine, citrus, stone fruit, tea-like body":"ياسمين، حمضيات، فاكهة ذات نواة، قوام شبيه بالشاي","blackcurrant, tomato, syrupy body, vivid acidity":"كشمش أسود، طماطم، قوام كالشراب، حموضة نابضة","caramel, red apple, balanced sweetness":"كراميل، تفاح أحمر، حلاوة متوازنة","mild chocolate, nuts, caramel, soft citrus, gentle acidity":"شوكولاتة خفيفة، مكسّرات، كراميل، حمضيات ناعمة، حموضة لطيفة","chocolate, peanut, heavy body, low acidity":"شوكولاتة، فول سوداني، قوام ثقيل، حموضة منخفضة","cocoa, orange, structured acidity":"كاكاو، برتقال، حموضة مبنيّة","honeyed sweetness, citrus, clean finish":"حلاوة عسلية، حمضيات، نهاية نظيفة","red fruit, floral, silky":"فاكهة حمراء، زهري، حريري","jasmine, bergamot, tropical — delicate & rare":"ياسمين، برغموت، استوائي — رقيقة ونادرة","wild, boozy, dried fruit, warm spice":"جامحة، كحولية، فاكهة مجففة، توابل دافئة","dried fruit, dark chocolate, spice, winey, full body":"فاكهة مجففة، شوكولاتة داكنة، توابل، طابع نبيذي، قوام ممتلئ","earthy, herbal, cedar, big body, low acidity":"ترابي، عشبي، أرز، قوام كبير، حموضة منخفضة","caramel, stone fruit, mild":"كراميل، فاكهة ذات نواة، معتدلة","chocolate, red apple, soft":"شوكولاتة، تفاح أحمر، ناعمة","spice, cedar, low acidity (often monsooned)":"توابل، أرز، حموضة منخفضة (غالبًا مُعالجة بالمونسون)","follow the descriptors printed on the bag":"اتبع الأوصاف المطبوعة على الكيس","built for clarity across its components":"مصمّمة للوضوح عبر مكوّناتها","Designed for this method — brew to the roast on the bag, and keep pours even since mixed densities extract at different rates.":"مصممة لهالطريقة — حضّر على التحميص المكتوب على الكيس، وخل صبك متساويًا لأن الخلطة فيها كثافات مختلفة تستخلص بسرعات مختلفة.","usually darker, denser; chocolate & nut":"عادةً أغمق وأكثف؛ شوكولاتة ومكسّرات","Roasted for pressure, not pour-over. Go coarser and cooler and pour gently.":"محمّصة للإسبريسو مو للتقطير. روح أخشن وأبرد واسكب بلطف.","comfortable, chocolatey, forgiving":"مريحة، شوكولاتية، متسامحة","Easy-going and hard to wreck — a good everyday dial-in.":"سهلة وما تنخرب بسهولة — معايرة يومية مريحة.","Conical and fast-flowing — the all-rounder, clarity-forward.":"مخروطي وسريع النزول — يناسب كل شيء، ويبرز الوضوح.","Flat bed with three small holes — forgiving and even. Pour in gentle pulses, keeping the water level low.":"قاعدة مسطحة بثلاث فتحات — متسامح ومتساوٍ. اسكب دفعات خفيفة وخل مستوى الماء واطيًا.","Thick filter slows the flow and adds clarity — grind a touch coarser and run water a touch hotter.":"فلتره سميك يبطئ النزول ويصفّي الفنجان — خشّن شوي وارفع الحرارة شوي.","Immersion then press: short contact, finer grind, less water. Cooler water suits it.":"غمر وضغط: تلامس قصير وطحنة أنعم وماء أقل. يناسبه ماء أبرد.","Immersion–dripper hybrid: steep with the valve closed, then open to release. A coarser grind suits the steep.":"غمر وتقطير معًا: انقع والصمام مقفول وبعدها افتحه. الطحنة الأخشن تناسب النقع.","Fine":"ناعم","Medium-fine":"ناعم–متوسط","Medium":"متوسط","Medium-coarse":"متوسط–خشن","Coarse":"خشن","like caster sugar":"كالسكر الناعم","like table salt":"كملح الطعام","like fine sand":"كالرمل الناعم","like granulated sugar":"كالسكر الحبيبي","like coarse sand":"كالرمل الخشن","like raw sea salt":"كملح البحر الخام","like kosher salt":"كالملح الخشن","Burrs loosen with use — match the texture, not just the number.":"شفرات الطاحونة ترتخي مع الاستخدام — طابق الملمس لا الرقم وحده.","Still degassing":"لا يزال يُطلق الغاز","Peak window":"نافذة النضج","Past peak":"بعد النضج","Tired":"مُتعَب","Healthy draw-down.":"تصريف صحّي.","Ran fast — usually grind too coarse or channeling (expect weak/sour).":"نزل الماء بسرعة — غالبًا الطحن أخشن من اللازم أو تكوّنت قنوات (توقّع فنجانًا خفيفًا أو حامضًا).","Stalled — usually grind too fine or over-agitated (expect bitter/muddy).":"توقّف النزول — غالبًا الطحن أنعم من اللازم أو التحريك زائد (توقّع مرارة أو عكارة).","Immersion holds water differently — retention is less diagnostic here.":"التخمير بالغمر يحتجز الماء بشكل مختلف — الاحتباس أقل دلالة هنا.","Hoffmann two-pour — brisk by design: two close pours (60% then 40%) meant to run almost back-to-back. The rests are the bloom and the drawdown, not between pours. Pour with intent if you are new. Recipe by James Hoffmann.":"طريقة هوفمان بصبتين — سريعة من طبعها: صبتان وراء بعض تقريبًا (60% ثم 40%)، والراحة كلها في الترطيب ونزول الماء، مو بين الصبات. لو أنت جديد اسكب بثبات وبس. الوصفة لجيمس هوفمان.","4:6 method, bigger first pour — five small, relaxed pours with a rest between each. Leans fruity — more acidity and clarity. Recipe by Tetsu Kasuya.":"طريقة 4:6 بصبة أولى أكبر — خمس صبات صغيرة على راحتك، وبين كل وحدة والثانية استراحة. تطلع فاكهية أكثر ووضوحها أعلى. الوصفة لتيتسو كاسويا.","4:6 method, smaller first pour — same relaxed five-pulse rhythm, weighted toward sweetness and body. Recipe by Tetsu Kasuya.":"طريقة 4:6 بصبة أولى أصغر — نفس الإيقاع المريح بخمس صبات، بس تميل للحلاوة والقوام. الوصفة لتيتسو كاسويا.","AeroPress immersion — steep, then press. Forgiving and quick; the timing isn't fussy.":"غمر إيروبريس — انقع واضغط وانتهينا. متسامح وسريع، والتوقيت مو مشكلة.","Switch immersion–drip — steep with the valve shut, then open to release. Relaxed and very forgiving.":"سويتش غمر وتقطير — انقع والصمام مقفول، وبعدها افتحه ينزل. مريح ومتسامح مرّة.","Bigger dose deepens the bed, so the grind is nudged coarser to keep extraction even. If it still tastes strong or bitter, go coarser still.":"قهوة أكثر تعني طبقة أعمق، عشان كذا خشّنا الطحنة شوي حتى يظل الاستخلاص متساويًا. لو ظل الطعم ثقيلًا أو مرًّا، خشّن أكثر.","Smaller dose means a shallower bed, so the grind is nudged finer. If it tastes thin or weak, go finer still.":"قهوة أقل تعني طبقة أخف، عشان كذا نعّمنا الطحنة شوي. لو طلع الطعم خفيفًا، نعّم أكثر.","Aim medium, like table salt, then correct by taste.":"استهدف الوسط، كملح الطعام، ثم صحّح بالتذوّق.","Internal dial under the burr — tighten to zero, count counter-clockwise. 40 clicks per turn, ~18µm each. Never grind below 16 clicks.":"القرص الداخلي تحت الرحى — اربط حتى الصفر ثم عُد عكس عقارب الساعة. ٤٠ نقرة للدورة، ~١٨ ميكرون لكل نقرة. لا تطحن تحت ١٦ نقرة.","Big dial, ~25µm per number — pour-over lives around 7–12; start at 9 and dial by taste.":"قرص كبير، ~٢٥ ميكرون لكل رقم — التقطير بين ٧ و١٢؛ ابدأ من ٩ واضبط بالتذوق.","A drop of RDT water kills static. Count clicks from fully closed.":"بخ الماء على القهوة قبل الطحن يزيل الكهرباء الساكنة. عُدّ النقرات من الإغلاق التام.","External numbered dial, ~30 clicks per rotation; count from zero.":"قرص خارجي مرقّم، ~30 نقرة لكل دورة؛ عُدّ من الصفر.","Numbered dial, 90 clicks/turn. Read whole turns plus clicks.":"قرص مرقّم، 90 نقرة/دورة. اقرأ الدورات الكاملة مع النقرات.","Pour-over-tuned burrs — small moves make a big difference.":"أسنان مضبوطة للتقطير — الحركات الصغيرة تُحدث فرقًا كبيرًا.","Clicks from zero (closed).":"نقرات من الصفر (مغلق).","Clicks from zero; the X burrs feel a touch finer.":"نقرات من الصفر؛ أسنان X تبدو أنعم قليلًا.","Count clicks from fully closed. MIBRU chart: espresso 6-10 — start drip ~15-17 and dial by taste.":"عدّ النقرات من الإغلاق التام. جدول ميبرو: إسبريسو 6–10 — للتقطير ابدأ ~15–17 واضبط بالتذوق.","87 levels, espresso fine to french coarse — MIBRU says the middle suits drip; start ~44.":"87 درجة من ناعمة الإسبريسو إلى خشونة الفرنش — ميبرو توصي بالمنتصف للتقطير؛ ابدأ ~44.","External dial, 8µm/click, 60 clicks per turn.":"قرص خارجي، 8 ميكرون/نقرة، 60 نقرة لكل دورة.","Stepless — set near the filter mark, then nudge by taste.":"بلا درجات — اضبط قرب علامة الفلتر ثم عدّل بالتذوّق.","Clicks from closed; less precise, so taste and adjust.":"نقرات من المغلق؛ أقل دقّة، لذا تذوّق وعدّل.","No real scale — aim medium-fine and accept some unevenness.":"لا مقياس فعلي — استهدف ناعم–متوسط واقبل بعض التفاوت.","Dial 1–40. Weigh beans in; expect a little retention.":"قرص 1–40. اوزن الحبوب؛ توقّع احتباسًا بسيطًا.","ESP gearing runs finer, so pour-over sits higher on the dial.":"تروس ESP أنعم، لذا يقع التقطير أعلى على القرص.","Dial 1–40; cleaner grind than the Encore.":"قرص 1–40؛ طحن أنظف من الإنكور.","Setting 1–11 with thirds. Single-dose, very low retention.":"ضبط 1–11 بالأثلاث. جرعة مفردة، احتباس منخفض جدًا.","Wider range than the Ode; use the third-marks for fine moves.":"مدى أوسع من الأود؛ استخدم علامات الأثلاث للحركات الدقيقة.","Reference numbers (not absolute). Single-dose, near-zero retention.":"أرقام مرجعية (ليست مطلقة). جرعة مفردة، احتباس قرب الصفر.","Outer dial 1–60 plus inner fine adjust. Purge a little first.":"قرص خارجي 1–60 مع ضبط داخلي دقيق. طهّر قليلًا أولًا.","Numbered dial; the filter range sits mid-scale.":"قرص مرقّم؛ مدى الفلتر في وسط المقياس.","Stepless dial with markings; single-dose friendly.":"قرص بلا درجات مع علامات؛ مناسب للجرعة المفردة.","Single-dose, stepless — set by reference. RDT helps with static.":"جرعة مفردة، بلا درجات — اضبط بالمرجع. بخ الماء قبل الطحن يساعد ضد الكهرباء الساكنة.","Stepless and geared fine — make small moves.":"بلا درجات وتروس دقيقة — حرّكها بخطوات صغيرة.","Stepless single-doser — log a reference number per coffee.":"جرعة مفردة بلا درجات — سجّل رقمًا مرجعيًا لكل قهوة.","1 · Fresh coffee":"1 · قهوة طازجة","Whole beans roughly 1–4 weeks off roast, ground right before you brew. Stale or pre-ground coffee caps how good the cup can get, no matter your technique.":"استخدم حبوب كاملة مر عليها أسبوع إلى أربعة أسابيع من التحميص، واطحنها قبل التحضير مباشرة. القهوة القديمة أو المطحونة من قبل تحدّ من مستوى الفنجان مهما كانت مهارتك.","2 · A scale":"2 · ميزان","Weighing your coffee and water is the most important step for a consistent result. 0.1 g resolution is ideal. Handy fact: 1 ml of water weighs 1 g — the millilitres in the recipe are exactly what your scale shows.":"وزن القهوة والماء أهم نقطة في ثبات النتيجة. ميزان بدقة 0.1 غ أكثر من كافي. ومعلومة تسهّل عليك: 1 مل ماء = 1 غرام، فالمليلترات في الوصفة هي نفس الرقم اللي يطلع لك على الميزان.","3 · An even grind":"3 · طحن متساوٍ","A burr grinder (not a blade) grinds evenly. Grind size is your main dial: finer pulls more (risking bitter), coarser pulls less (risking sour).":"مطحنة ببُرّات (Burr) وليست شفرة مثل الخلاط (وليست شفرة تلفّ مثل الخلاط) تعطيك طحنة متساوية. حجم الطحن أهم شيء بيدك: كلما نعّمت زاد الاستخلاص (وقد تظهر مرارة)، وكلما خشّنت قلّ (وقد تظهر حموضة).","4 · Good water, just off boil":"4 · ماء نقي بعد الغليان مباشرة","Water is about 98% of the cup, so filtered or soft water helps a lot. Just off the boil for most roasts; a little cooler for dark.":"الماء يشكّل حوالي 98% من فنجانك، فالماء المفلتر يفرق كثيرًا. استخدم الماء بعد ما يغلي مباشرة مع أغلب التحميصات، وإذا كان التحميص غامق انتظر 20–30 ثانية، وأبرد قليلًا للتحميص الغامق.","5 · Even pouring":"5 · صبّ متساوٍ","Wet all the grounds, then pour gently and evenly in circles. Sloppy pours channel water and extract unevenly.":"بلّل كل القهوة المطحونة أولًا، ثم اسكب بهدوء وبحركات دائرية متساوية. الصبّ العشوائي يخلي الماء يمشي في قنوات داخل القهوة ويعطيك استخلاصًا غير متساوٍ.","Extraction":"الاستخلاص","How much flavour you have dissolved out of the grounds. Too little tastes sour; too much tastes bitter; the middle is sweet and balanced.":"كم نكهة سحب الماء من القهوة. القليل يطلع حامضًا، والكثير يطلع مرًّا، والمنطقة الوسطى هي الحلاوة والتوازن.","Extraction yield":"نسبة الاستخلاص","The percentage of the coffee mass that dissolved (target roughly 18–22%). Only truly known with a refractometer.":"النسبة المئوية من وزن القهوة التي ذابت فعلًا في الماء (الهدف حوالي 18–22%). لا تُقاس بدقة إلا بجهاز الرفراكتوميتر.","Bloom":"الترطيب","The first small pour that wets the grounds and lets fresh coffee release trapped CO₂ before the main pour.":"أول صبة صغيرة تبلّل القهوة وتسمح للغاز المحبوس بالخروج قبل الصبات الأساسية.","Ratio":"النسبة","Coffee to water, e.g. 1:16.7 means 16.7 g water per 1 g coffee. More water is weaker and cleaner; less is stronger and heavier.":"نسبة القهوة إلى الماء: 1:16.7 يعني 16.7 غ ماء لكل غرام قهوة. ماء أكثر يعطيك فنجانًا أخف وأنظف، وماء أقل يعطيك أقوى وأثقل.","Agitation":"التحريك","Stirring, swirling, and pour force. More agitation speeds extraction, but overdone it turns harsh.":"أي تقليب أو تدوير أو صبّ قوي. التحريك يسرّع الاستخلاص، لكن إذا زاد عن حدّه طلع الطعم خشنًا.","Channelling":"تكوّن القنوات","Water finding a fast path through cracks in the bed, so some grounds over-extract while others barely brew. Even pours prevent it.":"عندما يجد الماء طريقًا سريعًا عبر شق في طبقة القهوة، فيُستخلص جزء أكثر من اللازم وجزء آخر بالكاد يلمسه الماء. الصبّ المتساوي يمنع هذا.","Draw-down":"التصريف","How long the water takes to drain after your last pour. Fast usually means too coarse; slow or stalled means too fine.":"الوقت الذي يحتاجه الماء لينزل بعد آخر صبة. إذا خلص التصريف بسرعة فغالبًا الطحن خشن، وإذا تأخر كثير فالغالب إنه ناعم زيادة، ولو تأخر أو توقف فهي ناعمة زيادة.","Degassing":"إطلاق الغاز","Fresh-roasted coffee releasing CO₂ for days after roast. Lots of gas makes a big bloom and can read sour.":"القهوة الطازجة تظل تطلق غاز ثاني أكسيد الكربون أيامًا بعد التحميص. كلما كانت القهوة أطزج، كان خروج الغاز أكثر أثناء الترطيب وقد يعطي طعمًا حامضًا.","TDS / strength":"المواد الذائبة / القوة","Total dissolved solids — how concentrated the brew is. Measured with a refractometer; the Strength setting is the everyday lever.":"يعني تركيز القهوة في الفنجان. يُقاس بجهاز الرفراكتوميتر، أما يوميًا فإعداد القوة في التطبيق يكفيك.","Flash / Japanese iced":"فلاش / المثلّج الياباني","Brewing hot straight onto ice to chill instantly and keep the aromatics. Different from cold brew.":"تحضّر القهوة ساخنة وتنزل مباشرة على الثلج، فتبرد فورًا وتحتفظ بعطرياتها. يختلف تمامًا عن الكولد برو.","Cold brew":"تخمير بارد","Steeping grounds in cold water for many hours. Low acidity and smooth, but it loses the lively, aromatic notes.":"نقع القهوة في ماء بارد لساعات طويلة. النتيجة ناعمة وقليلة الحموضة، لكنها تكون أقل في الروائح والنكهات الزاهية مقارنة بالقهوة المحضرة ساخنة.","Essential":"أساسي","A scale (0.1 g), a burr grinder, and fresh coffee. These three decide most of your cup.":"ميزان بدقة 0.1 غ، ومطحنة بشفرات طحن، وقهوة طازجة — هذه الثلاثة تصنع معظم الفنجان.","Helps a lot":"يساعد كثيرًا","A gooseneck kettle for pour control, plus a dripper and filters you like (V60, Kalita Wave, Chemex...).":"غلاية بعنق طويل تتحكم فيها بالصبّ، وقمع وفلاتر تناسبك (V60، كاليتا، كيمكس...).","Nice, not needed":"جميل، لكنه غير ضروري","A temperature-control kettle, a timer (your phone is fine), and a refractometer (only if you want to measure — you can brew great coffee without one).":"غلاية بتحكم في الحرارة، ومؤقّت (جوالك يكفي)، ورفراكتوميتر إن كنت من محبي الأرقام — تقدر تحضّر قهوة ممتازة بدونها كلها.","Honest advice":"نصيحة صادقة","An expensive dripper will not fix a bad grinder. If you are going to spend, spend on the grinder first.":"القمع الغالي لن يصلّح مطحنة سيئة — إذا كنت ستصرف، فاصرف على المطحنة أولًا."
};

function renderInputs(){

  }

  html+=field("Brewer",seg("brewer",BREWERS));
  html+=field("Coffee type",seg("kind",[{id:"single",label:"Single origin"},{id:"blend",label:"Blend"}],"teal"));
  if(state.kind==="single"){html+=field("Origin / variety",sel("origin",sortedOrigins()));html+=field("Process",seg("process",PROCESSES))}
  else{html+=field("Blend style",sel("blendStyle",BLENDS))}
  html+=field("Tasting notes — from the bag (optional)",'<input type="text" class="txt" data-key="bagnotes" placeholder="'+tr("e.g. peach, jasmine, honey")+'" value="'+(state.bagNotes||"").split('"').join("&quot;")+'">');
  html+=field("Roast level",seg("roast",ROASTS));
  html+=field("Roast date",'<input type="date" class="dateinp" data-key="roastdate" value="'+state.roastDate+'">');
  html+=field("Days since roast",step("days","")+'<div class="fresh-dot" style="color:'+fc+'">● '+tr(fl)+'</div>');
  html+=field("Dose (g)",doseStep()+'<div class="hint">→ '+r.totalWater+P('ml','مل')+' @ '+r.ratioStr+'</div>');
  html+=field("Strength",seg("strength",STRENGTHS,"teal"));
  if(state.serve==="iced"&&(BREWERS.find(function(b){return b.id===state.brewer})||{}).kind==="pour"){html+=field("Iced style",seg("icedStyle",[{id:"hoffmann",label:"Hoffmann"},{id:"foursix",label:"Kasuya 4:6"},{id:"fifty",label:"50 / 50"}]));}else{html+=field("Brew Style",seg("goal",GOALS,"teal"));}
  inputs.innerHTML=html;
}

  var b="";

    b+='<div class="mtitle">'+P("FELLOW AIDEN — EDIT PROFILE → ADVANCED","فيلو أيدن — تعديل البروفايل ← متقدم")+'</div>';b+=mrow(P("Brew Style","أسلوب التحضير"),tr(GOALS.find(function(x){return x.id===state.goal}).label));b+=mrow(P("Strength","القوة"),tr(STRENGTHS.find(function(x){return x.id===state.strength}).label));

function whyRecipe(rec,st){
  var roast=ROASTS.find(function(x){return x.id===st.roast})||{};var parts=[];
  if(st.roast==="light"||st.roast==="med-light")parts.push(P("Light-ish roast, so near-boiling water ("+rec.temp+"°C) and a finer grind to pull enough out of dense, lightly-roasted beans.","تحميصها فاتح، عشان كذا الماء قريب من الغليان ("+rec.temp+"°م) والطحنة أنعم عشان نستخلص ما يكفي من حبوب كثيفة تحميصها خفيف."));
  else if(st.roast==="dark"||st.roast==="med-dark")parts.push(P((roast.label||"Darker")+" roast, so cooler water ("+rec.temp+"°C) and a coarser grind so it does not turn bitter.",tr(roast.label||"Darker")+" تحميص، عشان كذا الماء أبرد ("+rec.temp+"°م) والطحنة أخشن عشان ما تطلع مرّة."));
  else parts.push(P("Medium roast, so middle-of-the-road water ("+rec.temp+"°C) and grind.","تحميص متوسط، فالماء والطحنة في الوسط ("+rec.temp+"°م)."));
  if(rec.freshId==="fresh")parts.push(P("Beans are still gassy ("+st.days+"d), so expect a big bloom and a slightly muted cup.","الحبوب ما زال فيها غاز ("+st.days+" يوم)، فتوقّع فورانًا كبيرًا ونكهات ما اكتملت بعد."));
  else if(rec.freshId==="aging")parts.push(P("Aging ("+st.days+"d): the app applied +1°C and one step finer versus this bag at its peak.","في مرحلة التعب ("+st.days+" يوم): طبّق التطبيق +١° ودرجة أنعم مقارنة بالكيس في قمته."));
  else if(rec.freshId==="stale")parts.push(P("Past its peak ("+st.days+"d): the app applied +2°C and two steps finer versus this bag at its peak.","تعدّى ذروته ("+st.days+" يوم): طبّق التطبيق +٢° ودرجتين أنعم مقارنة بالكيس في قمته."));
  if(st.kind==="single"){var p=PROCESSES.find(function(x){return x.id===st.process})||{};if(p.id==="natural"||p.id==="anaerobic"||p.id==="coferment")parts.push(P("It is "+(p.label||"").toLowerCase()+", so gentler pours — the bed is fragile and gassy.","إنها "+tr(p.label||"")+"، فخلّ صباتك ألطف — الطبقة هشة ومليانة غاز."));else if(p.id==="washed")parts.push(P("Washed, so brew straight for clarity.","مغسولة، فحضّرها على طول — بتعطيك وضوحًا."));}
  else{var b=BLENDS.find(function(x){return x.id===st.blendStyle})||{};if(b.notch||b.temp)parts.push(P((b.label||"Blend")+", nudged coarser and cooler since it is denser and darker-leaning.",tr(b.label||"Blend")+"، خشّناها وبرّدناها شوي لأنها أكثف وتميل للغامق."));}
  if(rec.iced)parts.push(P("Served iced: brewed hot then flash-chilled over ice, ground a touch finer to survive the melt.","تقدَّم باردة: تنحضر حارة وتنزل على الثلج فورًا، ومطحونة أنعم شوي عشان تصمد مع ذوبان الثلج."));
  return parts.join(" ");
}
function originWhy(st){
  if(st.kind==="blend"){var b=BLENDS.find(function(x){return x.id===st.blendStyle})||{};return P("This is a blend, not a single origin — the only origin-style lever is “"+(b.label||"")+"”, which "+((b.notch||b.temp)?"nudges the grind and temp a little":"does not change the numbers")+". The actual flavour depends on the roaster mix, so lean on the bag notes.","هذي خلطة مو منشأ واحد — الشيء الوحيد الشبيه بالمنشأ هنا هو “"+tr(b.label||"")+"”، وهو "+((b.notch||b.temp)?"يعدّل الطحنة والحرارة شوي":"ما يغيّر الأرقام")+". النكهة الحقيقية على خلطة المحمّص، فاعتمد على إيحاءات الكيس.");}
  var o=ORIGINS.find(function(x){return x.id===st.origin})||{};var roast=(ROASTS.find(function(x){return x.id===st.roast})||{}).label||"";

function coachAdvice(t,st,rec,flw){
  var light=(st.roast==="light"||st.roast==="med-light"),dark=(st.roast==="med-dark"||st.roast==="dark");
  var temp=rec.temp,hotMax=temp>=99,coolMin=temp<=88,fresh=rec.freshId,days=st.days,bag=(st.bagNotes||"").trim();
  var A={title:"",moves:[],age:""};
  if(t==="sour"){A.title=P("Sour / sharp = under-extracted","حامض / حاد = استخلاص ناقص");
    A.moves.push(hotMax?P("Water is already near max — make the change at the grinder: go one step finer.","الماء وصل حده الأعلى — عدّل من المطحنة: درجة وحدة أنعم."):P("Go one step finer, and/or raise the water 1–2°C (you are at "+temp+"°C).","اطحن درجة أنعم، أو ارفع حرارة الماء 1–2°م (أنت الحين عند "+temp+"°م)."));
    if(flw==="fast")A.moves.push(P("Your draw-down ran fast — that confirms under-extraction. Go finer, and pour more evenly to stop channeling.","الماء نزل بسرعة — وهذا يؤكد الاستخلاص الناقص. اطحن أنعم واسكب بتساوٍ أكثر عشان ما تصير قنوات."));
    if(dark)A.moves.push(P("Sour on a dark roast is unusual — check the water is truly hot and you are not pouring too fast.","حموضة في تحميص غامق شيء غريب — تأكد أن الماء حار فعلًا وأنك ما تسكب بسرعة."));
    if(fresh==="fresh")A.age=P("It is still early ("+days+"d). Fresh coffee off-gasses CO₂ that pushes water away and reads sour — a few more days of rest helps as much as grinding finer.","ما زال الوقت مبكرًا ("+days+" يوم). القهوة الطازجة تطلع غازًا يدفع الماء ويبين حامضًا — كم يوم راحة تفيد بقدر الطحنة الأنعم.");
  }else if(t==="bitter"){A.title=P("Bitter / harsh = over-extracted","مرّ / خشن = استخلاص زائد");
    A.moves.push((coolMin||dark)?P("Your temp is already low — fix it at the grinder: go one step coarser and keep the brew a little shorter. Do not drop temp further.","حرارتك واطية أصلًا — عدّل من المطحنة: درجة أخشن وخلّ التحضير أقصر شوي. لا تنزل الحرارة أكثر."):P("Go one step coarser, and/or drop the water 1–2°C (you are at "+temp+"°C).","اطحن درجة أخشن، أو نزّل حرارة الماء 1–2°م (أنت الحين عند "+temp+"°م)."));
    if(flw==="stall")A.moves.push(P("Your draw-down stalled — that confirms over-extraction. Go coarser to speed the flow.","الماء وقف عن النزول — وهذا يؤكد الاستخلاص الزائد. اطحن أخشن عشان يمشي الماء."));
    A.moves.push(P("Keep pours even and do not agitate the bed too hard.","خلّ صبك متساويًا ولا تحرّك الطبقة بقوة."));
    if(fresh==="stale")A.age=P("Past-peak coffee can read bitter-without-sweetness — some of that is age, not extraction. Coarser helps, but do not chase it.","القهوة اللي عدّت نضجها ممكن تطلع مرّة بلا حلاوة — جزء منها عمر مو استخلاص. الأخشن يساعد بس لا تلاحقه.");
  }else if(t==="weak"){A.title=P("Weak / watery = under-strength","ضعيف / مائي = نقص قوة");

var FUND=[
{t:"1 · Fresh coffee",d:"Whole beans roughly 1–4 weeks off roast, ground right before you brew. Stale or pre-ground coffee caps how good the cup can get, no matter your technique."},
{t:"2 · A scale",d:"Weighing your coffee and water is the most important step for a consistent result. 0.1 g resolution is ideal. Handy fact: 1 ml of water weighs 1 g — the millilitres in the recipe are exactly what your scale shows."},
{t:"3 · An even grind",d:"A burr grinder (not a blade) grinds evenly. Grind size is your main dial: finer pulls more (risking bitter), coarser pulls less (risking sour)."},
{t:"4 · Good water, just off boil",d:"Water is about 98% of the cup, so filtered or soft water helps a lot. Just off the boil for most roasts; a little cooler for dark."},
{t:"5 · Even pouring",d:"Wet all the grounds, then pour gently and evenly in circles. Sloppy pours channel water and extract unevenly."}
];
var CHAIN=[
{t:"Origin sets the bean",d:"Altitude and variety decide density and character. Roasters pick the roast level to flatter it: bright, dense coffees (Ethiopia, Kenya) usually go lighter to protect florals; softer, nutty ones (Brazil) take medium-dark gracefully. That is why you rarely meet a dark Gesha."},
{t:"Roast sets the clock",d:"Darker roasts are more porous and release their CO2 faster — they peak earlier and fade sooner. Light roasts trap gas in dense structure: they need longer rest and stay good longer. Process nudges the same clock — naturals usually want a few extra days."},
{t:"The date tells you where you are",d:"Day 20 can mean at its peak for a light washed coffee and past it for a dark roast. The number on the bag only means something combined with the roast and process."},
{t:"What the app does with this",d:"Your rest window is computed from roast and process, the freshness stage nudges grind and temperature, and the widget counts the days for you. Enter the roast date once — the chain runs itself."}
];
var PROCX=[{t:"Wet-hulled (Giling Basah)",d:"Sumatra’s method: the parchment is stripped while the bean is still wet and soft, then dried bare. It trades acidity for weight — earthy, herbal, syrupy cups. If the bag says Sumatra and tastes like a forest floor in the best way, this is why."},{t:"Decaf",d:"Caffeine is removed before roasting (Swiss Water, CO2, or EA methods). The processing leaves beans porous and fast-extracting, so decaf turns bitter easily — the app brews it a degree cooler, and coarser is the first fix if it still bites."},{t:"Co-fermented / Infused",d:"Co-fermented: fruit, spices, or specific yeasts are added to the fermentation tank so the flavor develops inside the seed. Infused: flavor is added after processing. Both give loud, unmistakable aromatics — and honest roasters disclose which one you are holding. Brewed slightly cooler so the added notes stay pleasant instead of harsh."}];
var BREWTIME=[
{t:"What it is",d:"The total time from the first drop of water to an empty, drained bed. You never control it directly — it is the result of your grind, your dose, and how you pour."},
{t:"Why it matters",d:"Water needs enough contact time to dissolve the sweetness out of the coffee. Brew time is the clearest sign of whether that contact actually happened."},
{t:"Way too fast",d:"Water raced through without extracting enough — expect a weak, sour, thin cup. Usual causes: grind too coarse, or channeling from uneven pouring."},
{t:"Way too slow",d:"Water sat on the coffee too long and kept stripping harsh compounds — expect bitter, dry, muddy. Usual causes: grind too fine, too much agitation, or a clogged filter."},
{t:"Fix the cause, not the clock",d:"You do not fix time directly — adjust the grind and time follows. Finishing near the expected time with an even bed is the real target."},
{t:"Taste is the judge",d:"A rough guide: within about 30 seconds of the recipe finish time is normal. If the time looked off but the cup tastes great — trust the cup. Time is a guide, taste decides."}
];
var PROC=[{t:"Washed",d:"The fruit is stripped off the seed, the beans ferment in water tanks to loosen the last sticky layer, then they are washed clean and dried. You taste the bean itself: clean, clear, brighter acidity."},{t:"Honey",d:"The skin comes off but some of the sticky fruit layer (the honey) stays on the bean while it dries. Halfway between washed and natural: more sweetness and body than washed, cleaner than natural."},{t:"Natural (dry)",d:"The whole cherry is dried in the sun with the fruit still on, then hulled. The bean absorbs fruit sugars for days — fruity, heavy, wine-like sweetness, and a more fragile bed when you brew."},{t:"Anaerobic",d:"Cherries ferment in sealed, oxygen-free tanks before drying. The controlled fermentation creates bold, unusual flavours — funky, boozy, intense. A little goes a long way; brew it gently."}];
var GLOSS=[
{t:"Extraction",d:"How much flavour you have dissolved out of the grounds. Too little tastes sour; too much tastes bitter; the middle is sweet and balanced."},
{t:"Extraction yield",d:"The percentage of the coffee mass that dissolved (target roughly 18–22%). Only truly known with a refractometer."},
{t:"Bloom",d:"The first small pour that wets the grounds and lets fresh coffee release trapped CO₂ before the main pour."},
{t:"Ratio",d:"Coffee to water, e.g. 1:16.7 means 16.7 g water per 1 g coffee. More water is weaker and cleaner; less is stronger and heavier."},
{t:"Agitation",d:"Stirring, swirling, and pour force. More agitation speeds extraction, but overdone it turns harsh."},
{t:"Swirl",d:"Hold the brewer or server and give it a gentle circular shake — like swirling juice in a glass — to level the bed and even out extraction. No spoon: stirring is a different, stronger move."},{t:"Channelling",d:"Water finding a fast path through cracks in the bed, so some grounds over-extract while others barely brew. Even pours prevent it."},
{t:"Draw-down",d:"How long the water takes to drain after your last pour. Fast usually means too coarse; slow or stalled means too fine."},
{t:"Degassing",d:"Fresh-roasted coffee releasing CO₂ for days after roast. Lots of gas makes a big bloom and can read sour."},
{t:"TDS / strength",d:"Total dissolved solids — how concentrated the brew is. Measured with a refractometer; the Strength setting is the everyday lever."},
{t:"Flash / Japanese iced",d:"Brewing hot straight onto ice to chill instantly and keep the aromatics. Different from cold brew."},
{t:"Cold brew",d:"Steeping grounds in cold water for many hours. Low acidity and smooth, but it loses the lively, aromatic notes."}
];
var KIT=[
{t:"Essential",d:"A scale (0.1 g), a burr grinder, and fresh coffee. These three decide most of your cup."},
{t:"Helps a lot",d:"A gooseneck kettle for pour control, plus a dripper and filters you like (V60, Kalita Wave, Chemex...)."},
{t:"Nice, not needed",d:"A temperature-control kettle, a timer (your phone is fine), and a refractometer (only if you want to measure — you can brew great coffee without one)."},
{t:"Honest advice",d:"An expensive dripper will not fix a bad grinder. If you are going to spend, spend on the grinder first."}
];
function learnSection(title,items){return '<div class="learn-sec"><div class="learn-h">'+tr(title)+'</div>'+items.map(function(it){return '<div class="learn-item"><div class="learn-t">'+tr(it.t)+'</div><div class="learn-d">'+tr(it.d)+'</div></div>'}).join('')+'</div>';}
function renderLearn(){learnView.innerHTML='<div class="libtitle">'+tr("Learn")+'</div><div class="libsub">'+tr("The basics that matter.")+'</div>'+learnSection("The five that matter most",FUND)+learnSection("Origin, roast, and the date — one chain",CHAIN)+learnSection("Why brew time matters",BREWTIME)+learnSection("How each process is made",PROC.concat(PROCX))+learnSection("Glossary",GLOSS)+learnSection("What you actually need",KIT);}
function renderAll(){if(state.roastDate)state.days=daysFromIso(state.roastDate);var mv=document.getElementById("machineView");mv.style.display="none";if(view==="build"){buildView.style.display="";libraryView.style.display="none";learnView.style.display="none";renderInputs();renderCard();renderAfterBrew();updateSaveBar()}else if(view==="machine"){buildView.style.display="none";libraryView.style.display="none";learnView.style.display="none";mv.style.display="";renderMachine()}else if(view==="library"){buildView.style.display="none";libraryView.style.display="";learnView.style.display="none";renderLibrary()}else{buildView.style.display="none";libraryView.style.display="none";learnView.style.display="";renderLearn()}updateNav();applyStatic();persist()}
document.getElementById("nav").addEventListener("click",function(e){var lb=e.target.closest("[data-lang]");if(lb){lang=(lang==="ar")?"en":"ar";renderAll();return;}var b=e.target.closest("[data-nav]");if(!b)return;view=b.dataset.nav;taste=null;renderAll();});
document.getElementById("saveToggle").addEventListener("click",function(){openSaveForm("")});
document.getElementById("saveConfirm").addEventListener("click",function(){if(activeBagId&&findBag(activeBagId))logBrew(saveName.value,pendingVerdict);else saveNew(saveName.value,pendingVerdict);saveForm.classList.remove("open");saveName.value="";renderAll()});
document.getElementById("saveCancel").addEventListener("click",function(){saveForm.classList.remove("open")});
document.getElementById("saveBar").addEventListener("click",function(e){if(e.target&&e.target.id==="newBag"){activeBagId=null;JOURNEY=[];persist();clearAfterBrew();renderAll();}});
document.getElementById("poured").addEventListener("input",function(){renderAfterBrew();renderCard()});
document.getElementById("cupOut").addEventListener("input",function(){renderAfterBrew();renderCard()});
document.getElementById("afterBrew").addEventListener("input",function(e){if(e.target&&e.target.id==="finTime"){var v=e.target.value.replace(/[^0-9]/g,"");if(v.length>=3&&v.length<=4){var ss=v.slice(-2);if(+ss<60)e.target.value=v.slice(0,-2)+":"+ss;}}});
document.getElementById("afterBrew").addEventListener("change",function(e){if(e.target&&e.target.id==="finTime"){renderAfterBrew();}});

document.getElementById("machineView").addEventListener("click",function(e){if(e.target.closest("[data-machcard]")){shareMachineCard();return;}var sb=e.target.closest(".seg-btn");if(sb&&(sb.dataset.key==="machine"||sb.dataset.key==="tempProfile")){state[sb.dataset.key]=sb.dataset.id;persist();renderMachine();}});
document.getElementById("retResult").addEventListener("click",function(e){if(e.target.closest("[data-flowhelp]")){flowHelpOpen=!flowHelpOpen;renderAfterBrew();}});
card.addEventListener("click",function(e){if(e.target.closest("[data-why]")){whyOpen=!whyOpen;renderCard();return}if(e.target.closest("[data-tastehelp]")){tasteHelpOpen=!tasteHelpOpen;renderCard();return}if(e.target.closest("[data-sharecard]")){shareCard();return}if(e.target.closest("[data-share]")){doShare();return}if(e.target.closest("[data-jreset]")){JOURNEY=[];var bg=activeBagId?findBag(activeBagId):null;if(bg)bg.journey=[];persist();renderCard();return}if(e.target.closest("[data-flowhelp]")){flowHelpOpen=!flowHelpOpen;renderAfterBrew();return}if(e.target.closest("[data-timer]")){startTimer();return}if(e.target.closest("[data-apply]")){var rec=buildRecipe(state);var ap=coachApply(taste,state,rec);if(ap&&ap.act){var bag=activeBagId?findBag(activeBagId):null;if(bag){bag.history=bag.history||[];bag.history.unshift(brewEntry(rec,"",ap.action));if(bag.history.length>20)bag.history.pop();}JOURNEY.push({ts:Date.now(),date:today(),taste:taste,flow:flow,grind:rec.grindNumber,temp:rec.temp,ratio:rec.ratioStr,action:ap.action});if(JOURNEY.length>30)JOURNEY.shift();if(bag)bag.journey=JOURNEY.slice();persist();ap.act();streak=(streak.sym===taste)?{sym:taste,n:streak.n+1}:{sym:taste,n:1};lastAction=ap.action;taste=null;renderAll();}return;}var tb=e.target.closest("[data-taste]");if(tb){var v=tb.dataset.taste;if(v==="great"){openSaveForm("Dialed in ✓");return}if(v!==taste)streak={sym:null,n:0};taste=(taste===v)?null:v;renderCard();return}});
libraryView.addEventListener("click",function(e){if(e.target&&e.target.id==="impBtn"){var fld=document.getElementById("impCode");var raw=((fld&&fld.value)||"");var pos=raw.indexOf("CWS1.");if(pos<0){showToast(P("No valid code found","لم يُعثر على رمز صالح"));return;}var b64=raw.slice(pos+5).split(/[^A-Za-z0-9+/=]/)[0];try{var imp=JSON.parse(decodeURIComponent(escape(atob(b64))));if(!imp||!imp.brewer||!imp.roast)throw 0;if(STATE_DEFAULTS)Object.assign(state,STATE_DEFAULTS);Object.assign(state,imp);if(state.roastDate)state.days=daysFromIso(state.roastDate);activeBagId=null;JOURNEY=[];persist();view="build";renderAll();showToast(P("Brew imported — review, then save it","تم الاستيراد — راجع الوصفة ثم احفظها"));}catch(err){showToast(P("Could not read that code","تعذّرت قراءة الرمز"));}return;}var ld=e.target.closest("[data-libload]");if(ld){var en=LIBRARY[+ld.dataset.libload];if(en){try{Object.assign(state,JSON.parse(JSON.stringify(en.state)))}catch(e2){}if(!state.roastDate)state.roastDate=isoFromDays(state.days||14);activeBagId=en.id;JOURNEY=(en.journey||[]).slice();persist();}taste=null;streak={sym:null,n:0};lastAction="";clearAfterBrew();view="build";renderAll();return}var dd=e.target.closest("[data-libdel]");if(dd){var di=+dd.dataset.libdel;if(LIBRARY[di]&&LIBRARY[di].id===activeBagId)activeBagId=null;LIBRARY.splice(di,1);persist();renderLibrary();updateNav();return}});
inputs.addEventListener("click",(e)=>{const b=e.target.closest("[data-id]");if(b){state[b.dataset.key]=b.dataset.id;renderAll();return}const s=e.target.closest("[data-d]");if(s){const k=s.dataset.key,l=LIM[k];let nv=clamp(state[k]+(+s.dataset.d),l.min,l.max);if(l.dec)nv=Math.round(nv*10)/10;state[k]=nv;if(k==="days")state.roastDate=isoFromDays(nv);renderAll();return}});
inputs.addEventListener("change",(e)=>{const d=e.target.closest(".dateinp");if(d){state.roastDate=d.value;state.days=daysFromIso(d.value);renderAll();return}const s=e.target.closest("select[data-key]");if(s){state[s.dataset.key]=s.value;renderAll()}});
inputs.addEventListener("input",(e)=>{const tx=e.target.closest("input.txt");if(tx){state.bagNotes=tx.value;renderCard();return}const n=e.target.closest("input.num");if(n){const k=n.dataset.key,l=LIM[k];if(l.dec){var raw=n.value.replace(/[^0-9.]/g,"");var parts=raw.split(".");var clean=parts.length>1?parts[0]+"."+parts.slice(1).join("").slice(0,1):parts[0];var v=parseFloat(clean);if(!isNaN(v)){state[k]=v;renderCard()}}else{var iv=parseInt(n.value.replace(/[^0-9]/g,""),10);if(!isNaN(iv)){state[k]=iv;if(k==="days")state.roastDate=isoFromDays(iv);renderCard()}}}});
inputs.addEventListener("focusout",(e)=>{const n=e.target.closest("input.num");if(n){const k=n.dataset.key,l=LIM[k];let v=clamp(state[k],l.min,l.max);if(l.dec)v=Math.round(v*10)/10;state[k]=v;if(k==="days")state.roastDate=isoFromDays(v);renderAll()}});
var actx=null;
function initAudio(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null}}
function beep(freq,dur,vol){if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=freq;o.connect(g);g.connect(actx.destination);var t=actx.currentTime;g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.15));o.start(t);o.stop(t+(dur||0.15))}catch(e){}}
var tRec=null,tStart=0,tPausedAccum=0,tPauseStart=0,tRunning=false,tInterval=null,tLastIdx=-1,tLastTick=-1,tDone=false;
function renderTimerSteps(){document.getElementById("tSteps").innerHTML=tRec.pours.map(function(p,i){return '<div class="tstep" id="tstep'+i+'"><span class="tstep-t">'+fmt(p.t)+'</span><span class="tstep-l">'+plab(p.label)+'</span><span class="tstep-c">'+(lang==="ar"?("حتى "+p.cum+"مل"):(p.pour>0?"→ "+p.cum+"ml":p.cum+"ml"))+'</span></div>'}).join('');}
function startTimer(){tRec=buildRecipe(state);initAudio();tStart=Date.now();tPausedAccum=0;tPauseStart=0;tRunning=true;tLastIdx=-1;tLastTick=-1;tDone=false;renderTimerSteps();document.getElementById("tPause").textContent=tr("Pause");document.getElementById("timerOverlay").classList.add("show");if(tInterval)clearInterval(tInterval);tInterval=setInterval(tick,100);tick();}
function tick(){if(!tRunning)return;var E=(Date.now()-tStart-tPausedAccum)/1000;var ps=tRec.pours,idx=0;for(var i=0;i<ps.length;i++){if(ps[i].t<=E)idx=i;}var nextI=(idx<ps.length-1)?idx+1:-1;var cur=ps[idx];
document.getElementById("tTime").textContent=fmt(Math.floor(E));
document.getElementById("tTarget").textContent=(cur.pour>0?P("Pour to "+cur.cum+"ml","اسكب حتى "+cur.cum+"مل"):plab(cur.label)+" — "+cur.cum+P("ml","مل"));
document.getElementById("tNote").textContent=tr(cur.note||"");
document.getElementById("tBar").style.width=Math.min(100,cur.cum/ps[ps.length-1].cum*100)+"%";
var nx=document.getElementById("tNext");
if(nextI>=0){nx.textContent=P("Next in ","التالي بعد ")+Math.max(0,Math.ceil(ps[nextI].t-E))+P("s"," ث")+P(" → "," ← ")+plab(ps[nextI].label)+" ("+ps[nextI].cum+P("ml","مل")+")";}
else if(E<tRec.finishHi){nx.textContent=P("Let it drain — expected ","اتركه يتصرّف — متوقع ")+tRec.finishRange;}
else{nx.textContent=P("Done — enjoy.","انتهى — بالهناء والعافية.");}
for(var j=0;j<ps.length;j++){var se=document.getElementById("tstep"+j);if(se)se.className="tstep"+(j===idx?" active":(j<idx?" done":""));}
if(idx!==tLastIdx){if(tLastIdx>=0)beep(880,0.18,0.28);tLastIdx=idx;}
if(nextI>=0){var rem=Math.ceil(ps[nextI].t-E);if(rem<=3&&rem>=1&&rem!==tLastTick){beep(1320,0.05,0.14);tLastTick=rem;}}
if(!tDone&&E>=tRec.finishSec){tDone=true;beep(587,0.5,0.32);}
}
document.getElementById("tPause").addEventListener("click",function(){if(tRunning){tRunning=false;tPauseStart=Date.now();this.textContent=tr("Resume");}else{tPausedAccum+=Date.now()-tPauseStart;tPauseStart=0;tRunning=true;this.textContent=tr("Pause");}});
document.getElementById("tSkip").addEventListener("click",function(){if(!tRec)return;var now=Date.now();if(tPauseStart){tPausedAccum+=now-tPauseStart;tPauseStart=now;}var E=(now-tStart-tPausedAccum)/1000;var ps=tRec.pours,target=-1;for(var i=0;i<ps.length;i++){if(ps[i].t>E+0.2){target=ps[i].t;break;}}if(target<0)target=tRec.finishSec;tStart=now-tPausedAccum-Math.round(target*1000);tLastTick=-1;if(tRunning){tick();}else{tRunning=true;tick();tRunning=false;}});
document.getElementById("tReset").addEventListener("click",function(){tStart=Date.now();tPausedAccum=0;tPauseStart=0;tRunning=true;tLastIdx=-1;tLastTick=-1;tDone=false;document.getElementById("tPause").textContent=tr("Pause");tick();});
document.getElementById("tClose").addEventListener("click",function(){tRunning=false;if(tInterval){clearInterval(tInterval);tInterval=null;}document.getElementById("timerOverlay").classList.remove("show");});
renderAll();
</script></body></html>
